[project]
name = "day-68-flask-auth"
version = "0.1.0"
description = "Day 68 auth demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Flask==3.0.0",
  "Werkzeug==3.0.3",
  "flask_sqlalchemy==3.1.1",
  "SQLAlchemy==2.0.32",
  "Flask-Login==0.6.3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
exclude = ["static", "templates", "instance"]